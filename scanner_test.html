<script>
// ===================================================
//  External Neon Scanner — calls Apps Script via POST.
//  Hosted on GitHub Pages / Netlify / Cloudflare Pages / etc.
//  Camera works because the page is NOT inside the
//  Apps Script iframe.
// ===================================================

// ---------- API helper ----------
async function callApi(action, args) {
  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      // text/plain avoids CORS preflight; Apps Script parses
      // postData.contents as the raw string regardless.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, action, args: args || [] }),
      redirect: 'follow',
      mode: 'cors',
    });
    if (!res.ok) return { ok: false, message: 'HTTP ' + res.status };
    return await res.json();
  } catch (e) {
    return { ok: false, message: 'Network: ' + (e.message || e) };
  }
}

// ---------- Notification picker ----------
// Runs an action with its email/Slack notifications held, then asks which
// destinations to send to before continuing. Resolves with the action result.
async function callWithNotify(action, args) {
  const w = await callApi('runWithNotifyReview', [action, args || []]);
  const r = (w && w.result !== undefined) ? w.result : w;
  if (w && w.pendingToken && w.pending && w.pending.length) await reviewNotifications(w);
  return r;
}

function reviewNotifications(w) {
  return new Promise(resolve => {
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
    const msgs = w.pending.map(p =>
      '<details style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px">' +
      '<summary style="cursor:pointer;font-weight:600">' + esc(p.subject) + '</summary>' +
      '<pre style="white-space:pre-wrap;font-size:12px;color:var(--muted);margin:8px 0 0">' + esc(p.body) + '</pre></details>').join('');
    const boxes = (w.targets || []).map(t =>
      '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px">' +
      '<input type="checkbox" value="' + esc(t.id) + '" checked style="width:20px;height:20px"> ' +
      (t.kind === 'slack' ? '💬 ' : '✉️ ') + esc(t.label) + '</label>').join('');
    ov.innerHTML =
      '<div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:16px">' +
        '<h3 style="margin:0 0 4px">Send notification?</h3>' +
        '<div style="color:var(--muted);font-size:13px;margin-bottom:10px">Already saved. Pick who gets told (tap a message to preview).</div>' +
        msgs +
        '<div id="npBoxes">' + boxes + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="secondary" data-q="all">Select all</button><button class="secondary" data-q="none">Select none</button></div>' +
        '<div class="row"><button class="secondary" data-a="skip">Don\'t send</button><button class="primary" data-a="send">Send</button></div>' +
        '<div id="npStatus" style="font-size:13px;color:var(--muted)"></div>' +
      '</div>';
    document.body.appendChild(ov);
    const boxEls = () => Array.from(ov.querySelectorAll('#npBoxes input'));
    ov.querySelector('[data-q="all"]').onclick  = () => boxEls().forEach(b => b.checked = true);
    ov.querySelector('[data-q="none"]').onclick = () => boxEls().forEach(b => b.checked = false);
    const finish = async ids => {
      ov.querySelectorAll('button').forEach(b => b.disabled = true);
      ov.querySelector('#npStatus').textContent = ids.length ? 'Sending…' : 'Skipping…';
      const res = await callApi('sendPendingNotifications', [w.pendingToken, ids]);
      toast((res && res.message) || 'Done', 2000);
      ov.remove();
      resolve();
    };
    ov.querySelector('[data-a="send"]').onclick = () => finish(boxEls().filter(b => b.checked).map(b => b.value));
    ov.querySelector('[data-a="skip"]').onclick = () => finish([]);
  });
}

// ---------- Audio + haptic feedback ----------
let audioCtx;
function beep(freq=900, dur=80) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = 0.18;
    o.start();
    setTimeout(() => { o.stop(); }, dur);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(40);
}
function _tone(freq, dur, type, gain, delay) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (delay || 0) / 1000;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.18, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur / 1000);
    o.start(t0); o.stop(t0 + dur / 1000 + 0.02);
  } catch (e) {}
}
/** "Read" — the instant the camera sees a code. Short, high, with a tiny buzz. */
function tick() { _tone(1600, 45, 'square', 0.08); if (navigator.vibrate) navigator.vibrate(25); }
/** "Saved" — soft two-note ping, no vibration. */
function ping() { _tone(988, 90, 'sine', 0.16); _tone(1319, 140, 'sine', 0.16, 85); }
/** Get audio ready during a tap, so the first tick isn't late. */
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    _tone(1, 5, 'sine', 0.0001);
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function buzz() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'square'; o.frequency.value = 220;
    g.gain.value = 0.18;
    o.start();
    setTimeout(() => { o.stop(); }, 220);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
}

function toast(msg, ms=1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// ---------- App state ----------
const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('backBtn');

let videoStream = null;
let scanIntervalId = null;
let detector = null;
let lastScan = '';
let lastScanTime = 0;
// In-flight guard — while true, all new scan callbacks are ignored.
// Prevents the 250ms detection loop from firing multiple concurrent
// server calls when the network round-trip is slow.
let scanInFlight = false;
let currentScanCallback = null;

// New state for v2: role + per-session expected/current counts
let currentRole = 'toronto';   // Only role used (Rob role retired)
let expectedCount = 0;      // user-entered target before a scan session
let currentCount = 0;       // running count for current scan session
let pendingFlow = '';       // 'receive' | 'ship' — what comes after precount

let scanLoopOn = false;
function stopScanner() {
  scanLoopOn = false;
  if (scanIntervalId) { clearInterval(scanIntervalId); scanIntervalId = null; }
  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
}

function navigate(view, ...args) {
  if (pendingCount()) toast(pendingCount() + ' scan(s) still saving in the background');
  stopScanner();
  backBtn.style.display = (view === 'home') ? 'none' : 'inline-block';
  if (view === 'home')        renderHome();
  if (view === 'precount')    renderPrecount(args[0], args[1]);
  if (view === 'receive')     renderReceive();
  if (view === 'ship')        renderShipPicker();
  if (view === 'shipScan')    renderShipScan(args[0]);
  if (view === 'receiveReturn')     renderReceiveReturnPicker();
  if (view === 'receiveReturnScan') renderReceiveReturnScan(args[0]);
  if (view === 'lookup')      renderLookup();
  if (view === 'editDevice')  renderEditDevice();
  if (view === 'newShipment') renderNewShipment();
}
backBtn.onclick = () => navigate('home');

// ---------- PRE-COUNT PROMPT ----------
// flow: 'receive' or 'ship'
// extra: for 'ship', the Request ID (or null if using company-name shortcut later)
function renderPrecount(flow, extra) {
  pendingFlow = flow;
  expectedCount = 0;
  currentCount = 0;
  titleEl.textContent = flow === 'receive' ? 'Receive — How many?' : 'Ship — How many?';
  const subtitle = flow === 'receive'
    ? 'Roughly how many units are you about to scan in?'
    : 'How many units are you about to scan for this shipment?';
  app.innerHTML = `
    <div class="field precount-big">
      <label>${subtitle}</label>
      <input id="expCount" type="number" min="1" inputmode="numeric" autofocus />
    </div>
    <button class="primary" id="precountGo">Start scanning</button>
    <button class="secondary" style="margin-top:10px" id="precountSkip">Skip — I don't know yet</button>
  `;
  document.getElementById('expCount').focus();
  document.getElementById('precountSkip').onclick = () => skipPrecount(extra);
  document.getElementById('precountGo').onclick = () => {
    const n = parseInt(document.getElementById('expCount').value, 10);
    if (!n || n < 1) { toast('Enter a number'); return; }
    expectedCount = n;
    proceedAfterPrecount(extra);
  };
  document.getElementById('expCount').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('precountGo').click();
  });
}
function skipPrecount(extra) {
  expectedCount = 0;
  proceedAfterPrecount(extra);
}
async function proceedAfterPrecount(extra) {
  if (pendingFlow === 'receive') {
    renderReceiveScan();
    return;
  }
  if (pendingFlow === 'receiveReturn') {
    navigate('receiveReturnScan', extra);
    return;
  }
  if (pendingFlow === 'ship') {
    navigate('shipScan', extra);
  }
}

function counterBannerHTML() {
  const tgt = expectedCount;
  const cur = currentCount;
  let cls = '';
  let label;
  if (tgt > 0) {
    if (cur > tgt) cls = 'warn';
    else if (cur === tgt) cls = 'done';
    label = `${cur} of ${tgt} scanned`;
  } else {
    label = `${cur} scanned`;
  }
  return `<div class="counter-banner ${cls}" id="bigCounter">
    <div class="count-num" id="bigCounterNum">${cur}${tgt > 0 ? ' / ' + tgt : ''}</div>
    <div class="count-label" id="bigCounterLabel">${label}</div>
    <div class="pending-note" id="pendingNote"></div>
  </div>`;
}
function refreshCounter() {
  const banner = document.getElementById('bigCounter');
  if (!banner) return;
  const tgt = expectedCount;
  const cur = currentCount;
  let cls = 'counter-banner';
  let label;
  if (tgt > 0) {
    if (cur > tgt) cls += ' warn';
    else if (cur === tgt) cls += ' done';
    label = `${cur} of ${tgt} scanned`;
  } else {
    label = `${cur} scanned`;
  }
  banner.className = cls;
  document.getElementById('bigCounterNum').textContent = cur + (tgt > 0 ? ' / ' + tgt : '');
  document.getElementById('bigCounterLabel').textContent = label;
}

// ---------- Shared scanner UI ----------
function renderScannerBlock(parentId, onCodeFn) {
  currentScanCallback = onCodeFn;
  const hasBarcodeDetector = ('BarcodeDetector' in window);
  document.getElementById(parentId).innerHTML = `
    <div class="field" style="padding:8px">
      <div class="scanner-box" id="scannerBox">
        <video id="video" playsinline muted autoplay></video>
        <div class="reticle" id="reticle" style="display:none"></div>
      </div>
      <button class="primary" id="startCamBtn" style="margin-top:10px">
        ${hasBarcodeDetector ? 'Start camera' : 'Live camera not supported here'}
      </button>
      <div class="or-divider">— or —</div>
      <button class="secondary" id="photoBtn">Take photo with camera app</button>
      <input type="file" class="photo" id="photoInput" accept="image/*" capture="environment">
      <div class="or-divider">— or —</div>
      <div class="manual-row">
        <input id="manualImei" placeholder="Type/paste IMEI" inputmode="numeric" autocomplete="off">
        <button id="manualSubmit">Add</button>
      </div>
    </div>
    <div class="status ok" id="status">Tap <b>Start camera</b>, or take a photo, or type an IMEI.</div>
  `;
  document.getElementById('startCamBtn').disabled = !hasBarcodeDetector;
  document.getElementById('startCamBtn').onclick = () => startLiveCamera();
  document.getElementById('photoBtn').onclick = () => document.getElementById('photoInput').click();
  document.getElementById('photoInput').onchange = (e) => handlePhotoFile(e.target.files && e.target.files[0]);
  document.getElementById('manualSubmit').onclick = () => {
    const v = document.getElementById('manualImei').value.trim();
    if (v && currentScanCallback) {
      currentScanCallback(v);
      document.getElementById('manualImei').value = '';
    }
  };
  document.getElementById('manualImei').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('manualSubmit').click();
  });
  document.getElementById('video').style.display = 'none';
  document.getElementById('scannerBox').style.minHeight = '0';
}

async function startLiveCamera() {
  const btn = document.getElementById('startCamBtn');
  const status = document.getElementById('status');
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  if (status) { status.className = 'status ok'; status.textContent = 'Requesting camera…'; }

  if (!('BarcodeDetector' in window)) {
    showCamError('Browser missing BarcodeDetector. Use photo capture or type IMEI manually.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCamError('Browser does not expose camera access here.');
    return;
  }

  try {
    detector = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) {
    showCamError('BarcodeDetector init failed: ' + e);
    return;
  }

  unlockAudio();
  if (videoStream) { try { videoStream.getTracks().forEach(t => t.stop()); } catch (e) {} videoStream = null; }
  // Ask for a sharp picture first; if the phone stalls or refuses, fall back to the plain request.
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms))]);
  const ask = c => withTimeout(navigator.mediaDevices.getUserMedia({ video: c, audio: false }), 8000);
  let firstErr = null;
  try {
    videoStream = await ask({ facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } });
  } catch (e) { firstErr = e; }
  if (!videoStream) {
    if (status) status.textContent = 'Retrying camera…';
    try { videoStream = await ask({ facingMode: { ideal: 'environment' } }); }
    catch (e) {
      const m = (e && (e.name || e.message)) || String(e);
      showCamError('Camera didn\'t start (' + m + (firstErr ? '; first try: ' + ((firstErr.name || firstErr.message) || firstErr) : '') + '). ' +
        'Close other tabs/apps using the camera (including the live scanner), then tap Try camera again.');
      return;
    }
  }

  const video = document.getElementById('video');
  if (!video) return;
  video.srcObject = videoStream;
  video.style.display = 'block';
  document.getElementById('reticle').style.display = 'block';
  try { await Promise.race([video.play(), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}

  if (btn) btn.style.display = 'none';
  if (status) { status.className = 'status ok'; status.innerHTML = 'Camera live. Point at a QR code. <span class="count-pill" id="countPill">0 scanned</span>'; }

  // Continuous autofocus where the phone supports it (ignored elsewhere)
  try {
    const track = videoStream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
  } catch (e) {}

  // Look at frames continuously (one at a time, ~every 60 ms) instead of 4×/second
  scanLoopOn = true;
  let busy = false, last = 0;
  const loop = async (now) => {
    if (!scanLoopOn) return;
    if (!busy && now - last >= 60 && video.readyState >= 2) {
      busy = true; last = now;
      try {
        const codes = await detector.detect(video);
        if (codes && codes.length) {
          const text = codes[0].rawValue;
          if (text && currentScanCallback) currentScanCallback(text);
        }
      } catch (e) {}
      busy = false;
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function showCamError(msg) {
  stopScanner();
  const btn = document.getElementById('startCamBtn');
  if (btn) { btn.disabled = false; btn.style.display = 'block'; btn.textContent = 'Try camera again'; }
  const status = document.getElementById('status');
  if (status) {
    status.className = 'status err';
    status.innerHTML = msg + '<br><span style="color:var(--muted);font-size:12px">Use the photo button or type an IMEI manually below.</span>';
  }
}

async function handlePhotoFile(file) {
  if (!file) return;
  const status = document.getElementById('status');
  if (status) { status.className = 'status ok'; status.textContent = 'Decoding photo…'; }
  try {
    const bitmap = await createImageBitmap(file);
    if (!('BarcodeDetector' in window)) {
      if (status) {
        status.className = 'status warn';
        status.innerHTML = 'This browser cannot decode QR images. Type the IMEI manually below.';
      }
      return;
    }
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const codes = await det.detect(bitmap);
    if (codes && codes.length && codes[0].rawValue && currentScanCallback) {
      currentScanCallback(codes[0].rawValue);
    } else {
      if (status) { status.className = 'status warn'; status.textContent = 'No QR code found in that photo.'; }
      buzz();
    }
  } catch (e) {
    if (status) { status.className = 'status err'; status.textContent = 'Photo decode failed: ' + e; }
  }
  const el = document.getElementById('photoInput');
  if (el) el.value = '';
}

// ---------- READ-NOW / SAVE-IN-ORDER QUEUE (Receive, Ship, Receive Return) ----------
// A code is shown + ticks the moment it's read. Saving happens one at a time in the
// background, in scan order. Grey = saving · white ✓ = saved · amber = duplicate/warning
// · red ✗ = NOT saved (tap Retry).
let scanRows = [];          // newest first: { key, raw, imei, state, note }
let scanQueue = [];
let queueBusy = false;
let saveFn = null;          // raw -> Promise<server result>
let onSavedFn = null;       // (result) -> update counter
const recentSeen = {};      // key -> last time the camera saw it

function startQueuedFlow(save, onSaved) {
  scanRows = []; scanQueue = []; saveFn = save; onSavedFn = onSaved;
  Object.keys(recentSeen).forEach(k => delete recentSeen[k]);
  renderScanRows();
}
function _imeiOf(raw) { const m = String(raw).match(/\d{15}/); return m ? m[0] : String(raw).trim(); }
function pendingCount() { return scanRows.filter(r => r.state === 'pending').length; }
function errorCount() { return scanRows.filter(r => r.state === 'err').length; }

function queuedCapture(raw) {
  const text = String(raw || '').trim(); if (!text) return;
  const key = _imeiOf(text), now = Date.now();
  const seenAt = recentSeen[key]; recentSeen[key] = now;
  if (seenAt && now - seenAt < 4000) return;                 // still in front of the camera
  const existing = scanRows.find(r => r.key === key && r.state !== 'undone');
  if (existing) {
    if (existing.state === 'pending') return;                 // already saving
    if (existing.state === 'err') { retryRow(key); return; }  // re-scan of a failed one = retry
    beep(500); toast('Already scanned: ' + key); return;     // saved / duplicate already
  }
  tick(); flashReticle();
  scanRows.unshift({ key: key, raw: text, imei: key, state: 'pending', note: 'saving…' });
  renderScanRows();
  scanQueue.push(key);
  runQueue();
}
function retryRow(key) {
  const r = scanRows.find(x => x.key === key && x.state === 'err'); if (!r) return;
  tick(); r.state = 'pending'; r.note = 'saving…'; renderScanRows();
  scanQueue.push(key); runQueue();
}
async function runQueue() {
  if (queueBusy) return;
  queueBusy = true;
  try {
    while (scanQueue.length) {
      const key = scanQueue.shift();
      const row = scanRows.find(r => r.key === key && r.state === 'pending');
      if (!row || !saveFn) continue;
      let r;
      try { r = await saveFn(row.raw); }
      catch (e) { r = { ok: false, message: 'No connection — tap Retry' }; }
      if (!r || typeof r !== 'object') r = { ok: false, message: 'No response — tap Retry' };
      if (r.ok) {
        row.imei = r.imei || row.imei;
        if (r.warning) { row.state = 'warn'; row.note = r.message || 'saved, check'; beep(600); }
        else { row.state = 'saved'; row.note = r.action === 'location-updated' ? '✓ location updated' : '✓'; ping(); }
        if (onSavedFn) onSavedFn(r);
        setStatus(r.warning ? 'warn' : 'ok', r.message || ('Saved ' + row.imei));
      } else if (r.duplicate) {
        row.state = 'dup'; row.note = 'duplicate'; beep(500); setStatus('warn', r.message || 'Duplicate');
      } else {
        row.state = 'err'; row.note = '✗ ' + (r.message || 'not saved'); buzz(); setStatus('err', row.imei + ': ' + (r.message || 'not saved'));
      }
      renderScanRows();
    }
  } finally { queueBusy = false; }
}
function renderScanRows() {
  const p = pendingCount(), e = errorCount();
  const pn = document.getElementById('pendingNote');
  if (pn) pn.textContent = (p ? '⏳ ' + p + ' saving…' : '') + (p && e ? '  ·  ' : '') + (e ? '⚠ ' + e + ' not saved' : '');
  const list = document.getElementById('list');
  if (!list) return;
  if (!scanRows.length) { list.innerHTML = '<div class="empty">No scans yet.</div>'; return; }
  list.innerHTML = scanRows.slice(0, 200).map(r =>
    '<div class="item ' + r.state + '"><span class="imei">' + r.imei + '</span><span class="st">' + escHtml(r.note || '') + '</span>' +
    (r.state === 'err' ? '<button class="retry" data-retry="' + r.key + '">Retry</button>' : '') + '</div>').join('');
  list.querySelectorAll('[data-retry]').forEach(b => { b.onclick = () => retryRow(b.dataset.retry); });
}
function escHtml(x) { return String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function flashReticle() {
  const r = document.getElementById('reticle'); if (!r) return;
  r.classList.add('hit'); clearTimeout(r._t); r._t = setTimeout(() => r.classList.remove('hit'), 220);
}
/** Undo / Finalize must wait for saves to finish. */
function savesSettled(action) {
  const p = pendingCount();
  if (p) { toast('Still saving ' + p + ' scan(s) — one sec, then ' + action + ' again.'); return false; }
  return true;
}
function markLastSavedUndone() {
  const r = scanRows.find(x => x.state === 'saved' || x.state === 'warn');
  if (r) { r.state = 'undone'; r.note = 'undone'; }
  renderScanRows();
}

// ---------- RECEIVE ----------
const recentReceives = [];

// Toronto entry point: ask batch # first, then precount.
// Rob entry: navigate('precount','receive') directly from home — no batch input.
function renderReceive() {
  titleEl.textContent = 'Receive Devices';
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const defaultBatch = String(d.getFullYear()).slice(2) + pad(d.getMonth()+1) + pad(d.getDate());
  app.innerHTML = `
    <div class="field">
      <label>Batch # (YYMMDD)</label>
      <input id="batch" value="${defaultBatch}" autocomplete="off" />
    </div>
    <button class="primary" id="receiveContinue">Continue</button>
  `;
  document.getElementById('receiveContinue').onclick = () => {
    const b = document.getElementById('batch').value.trim();
    if (!b) { toast('Batch # required'); return; }
    window._torontoBatch = b;
    navigate('precount', 'receive');
  };
}

// Actual scan UI for the receive flow (both roles land here after precount).
function renderReceiveScan() {
  titleEl.textContent = 'Receive Devices';
  app.innerHTML = `
    ${counterBannerHTML()}
    <div id="scanArea"></div>
    <div class="scan-list" id="list"><div class="empty">No scans yet.</div></div>
    <div class="footer-actions">
      <button class="secondary" onclick="navigate('home')">Done</button>
    </div>
  `;
  recentReceives.length = 0;
  startQueuedFlow(
    raw => callApi('recordReceived', [(window._torontoBatch || ''), raw, currentRole]),
    r => { currentCount += 1; refreshCounter(); });
  renderScannerBlock('scanArea', queuedCapture);
}

async function onReceiveScan(text) {
  const now = Date.now();
  if (text === lastScan && now - lastScanTime < 3000) return;
  if (scanInFlight) return;
  lastScan = text; lastScanTime = now;
  scanInFlight = true;
  try {
    const batch = (window._torontoBatch || '');
    const r = await callApi('recordReceived', [batch, text, currentRole]);
    if (r.ok) {
      beep(r.action === 'location-updated' ? 700 : 900);
      currentCount += 1;
      refreshCounter();
      recentReceives.unshift({ imei: r.imei, note: r.action === 'location-updated' ? 'location updated' : 'added' });
      renderRecentReceives();
      setStatus('ok', r.message);
    } else if (r.duplicate) {
      beep(500); setStatus('warn', r.message);
    } else {
      buzz(); setStatus('err', r.message);
    }
  } finally { scanInFlight = false; }
}
function renderRecentReceives() {
  const list = document.getElementById('list');
  if (!recentReceives.length) {
    list.innerHTML = '<div class="empty">No scans yet.</div>';
    return;
  }
  list.innerHTML = recentReceives.slice(0, 50).map(r => `
    <div class="item">
      <span class="imei">${r.imei}</span>
      <span style="color:var(--muted);font-size:12px">${r.note || 'added'}</span>
    </div>
  `).join('');
}

// ---------- SHIP — picker ----------
async function renderShipPicker() {
  titleEl.textContent = 'Pick a Shipment';
  app.innerHTML = `<div class="status ok">Loading open shipments…</div>`;
  const r = await callApi('getOpenShipments', []);
  if (!r || !Array.isArray(r)) {
    if (r && r.message) { app.innerHTML = `<div class="status err">${r.message}</div>`; return; }
    app.innerHTML = `<div class="status err">Failed to load shipments</div>`;
    return;
  }
  let opts = '<option value="">-- pick a Request ID (open only) --</option>';
  r.forEach(s => {
    const remaining = s.qty > 0 ? Math.max(0, s.qty - (s.itemsLinked || 0)) : '?';
    opts += `<option value="${s.requestId}">${s.requestId}  •  ${s.company}  •  ${remaining} left of ${s.qty || '?'}</option>`;
  });
  // Rob role retired — always show the "Create new shipment" button.
  const createNewBtn = `<button class="secondary" onclick="navigate('newShipment')">Create new shipment</button>`;

  app.innerHTML = `
    <div class="field">
      <label>Open Shipments (${r.length})</label>
      <select id="reqPick">${opts}</select>
    </div>
    <button class="primary" onclick="goShip()">Start scanning</button>

    ${createNewBtn ? '<div class="or-divider">— or —</div>' + createNewBtn : ''}
  `;
}
function goShip() {
  const v = document.getElementById('reqPick').value;
  if (!v) { toast('Pick a Request ID'); return; }
  navigate('precount', 'ship', v);
}


// ---------- RECEIVE RETURN ----------
let returnScans = [];

async function renderReceiveReturnPicker() {
  titleEl.textContent = 'Receive Return — pick request';
  app.innerHTML = `<div class="status ok">Loading open return requests…</div>`;
  const list = await callApi('getOpenReturnRequests', []);
  if (!Array.isArray(list)) {
    app.innerHTML = `<div class="status err">${(list && list.message) || 'Failed to load returns'}</div>`;
    return;
  }
  if (!list.length) {
    app.innerHTML = `
      <div class="status">No open return requests.</div>
      <div style="margin-top:12px;color:#888;font-size:13px;line-height:1.4;">
        Create one first: in the Shipments tab, add a row with the customer's Company Code,
        set Reason to "Return", and Status to TBD. Then come back here.
      </div>
    `;
    return;
  }
  let opts = '<option value="">-- pick a Return Request --</option>';
  list.forEach(r => {
    const label = r.requestId + ' — ' + r.company + ' (expects ' + (r.qty || '?') + ')';
    opts += `<option value="${r.requestId}">${label}</option>`;
  });
  app.innerHTML = `
    <div class="field"><label>Open Return Requests</label>
      <select id="retReqPick">${opts}</select>
    </div>
    <button class="primary" onclick="goReceiveReturn()">Continue</button>
    <div style="margin-top:14px;color:#888;font-size:12px;line-height:1.4;">
      Each scanned IMEI will: unlink from its outbound shipment, set Devices Status to "Status Check",
      and append to the Returns tab grouped under this Request ID.
    </div>
  `;
}
function goReceiveReturn() {
  const v = document.getElementById('retReqPick').value;
  if (!v) { toast('Pick a Return Request'); return; }
  navigate('precount', 'receiveReturn', v);
}

async function renderReceiveReturnScan(requestId) {
  if (!requestId) { navigate('receiveReturn'); return; }
  currentRequestId = requestId;
  returnScans = [];
  currentCount = 0;
  titleEl.textContent = 'Receive Return: ' + requestId;
  app.innerHTML = `
    ${counterBannerHTML()}
    <div id="scanArea"></div>
    <div class="scan-list" id="list"><div class="empty">No scans yet.</div></div>
    <div class="footer-actions">
      <div class="row">
        <button class="secondary" onclick="undoLastReturnScan()">Undo last</button>
        <button class="primary" onclick="finalizeReturn()">Finalize</button>
      </div>
    </div>
  `;
  startQueuedFlow(
    raw => callApi('recordReturnedItem', [currentRequestId, raw, currentRole]),
    r => { currentCount = r.countSoFar || (currentCount + 1); refreshCounter(); });
  renderScannerBlock('scanArea', queuedCapture);
}

async function onReceiveReturnScan(text) {
  const now = Date.now();
  if (text === lastScan && now - lastScanTime < 3000) return;
  if (scanInFlight) return;
  lastScan = text; lastScanTime = now;
  scanInFlight = true;
  try {
    const r = await callApi('recordReturnedItem', [currentRequestId, text, currentRole]);
    if (r.ok) {
      beep(r.warning ? 600 : 900);
      currentCount = r.countSoFar || (currentCount + 1);
      refreshCounter();
      returnScans.unshift({ imei: r.imei, warn: r.warning, message: r.message });
      setStatus(r.warning ? 'warn' : 'ok', r.message);
      renderReturnList();
    } else if (r.duplicate) {
      beep(500); setStatus('warn', r.message);
    } else {
      buzz(); setStatus('err', r.message);
    }
  } finally { scanInFlight = false; }
}
function renderReturnList() {
  const list = document.getElementById('list');
  if (!returnScans.length) { list.innerHTML = '<div class="empty">No scans yet.</div>'; return; }
  list.innerHTML = returnScans.map(r => `
    <div class="item">
      <span class="imei">${r.imei}</span>
      ${r.warn ? '<span style="color:var(--warn);font-size:12px">unknown</span>' : ''}
    </div>
  `).join('');
}
async function undoLastReturnScan() {
  if (!savesSettled('undo')) return;
  const r = await callApi('undoLastScan', [currentRequestId]);
  if (r.ok) {
    toast(r.message);
    currentCount = Math.max(0, currentCount - 1);
    refreshCounter();
    markLastSavedUndone();
  } else {
    toast(r.message);
  }
}
async function finalizeReturn() {
  if (!savesSettled('finalize')) return;
  if (errorCount() && !confirm(errorCount() + ' scan(s) were NOT saved (red). Finalize anyway?')) return;
  if (!confirm('Finalize return ' + currentRequestId + '? This sets Qty Shipped to -' + currentCount + ' and closes the Return Request.')) return;
  const r = await callApi('finalizeReturn', [currentRequestId]);
  if (r.ok) {
    toast(r.message, 3000);
    setTimeout(() => navigate('home'), 1200);
  } else {
    toast(r.message);
  }
}

async function renderShipScan(requestId) {

  currentCount = 0;
  titleEl.textContent = 'Ship: ' + requestId;
  app.innerHTML = `

    <div id="scanArea"></div>
    <div class="scan-list" id="list"><div class="empty">No scans yet.</div></div>
    <div class="field" style="margin-top:12px"><label>2-pin cables qty</label>
      <input id="shipCab2pin" type="number" min="0" value="0" />
    </div>
    <div class="field"><label>6-pin cables qty</label>
      <input id="shipCab6pin" type="number" min="0" value="0" />
    </div>
    <div class="field"><label>7-pin cables qty</label>
      <input id="shipCab7pin" type="number" min="0" value="0" />
    </div>
    <div class="field"><label>Cable Sent Type</label>
      <select id="shipCableSentType"><option value="">-- pick source --</option></select>
    </div>
    <div class="footer-actions">
      <div class="row">
        <button class="secondary" onclick="undoLast()">Undo last</button>
        <button class="primary" onclick="finalize()">Finalize</button>
      </div>
    </div>
  `;
  startQueuedFlow(
    raw => callApi('recordShippedItem', [currentRequestId, raw]),
    r => { currentCount = r.countSoFar || (currentCount + 1); refreshCounter(); });
  renderScannerBlock('scanArea', queuedCapture);
  // Populate Cable Sent Type dropdown from server (Cables tab sources).
  callApi('getCableSources', []).then(sources => {
    if (!sources || !Array.isArray(sources)) return;
    const sel = document.getElementById('shipCableSentType');
    if (!sel) return;
    sel.innerHTML = '<option value="">-- pick source --</option>' +
      sources.map(s => '<option value="' + s + '">' + s + '</option>').join('');
  });
}
async function onShipScan(text) {
  const now = Date.now();
  if (text === lastScan && now - lastScanTime < 3000) return;
  if (scanInFlight) return;
  lastScan = text; lastScanTime = now;
  scanInFlight = true;
  try {
  const r = await callApi('recordShippedItem', [currentRequestId, text]);
  if (r.ok) {
    beep(r.warning ? 600 : 900);
    currentCount = r.countSoFar || (currentCount + 1);
    refreshCounter();
    shipScans.unshift({ imei: r.imei, warn: r.warning });
    setStatus(r.warning ? 'warn' : 'ok', r.message);
    renderShipList();
  } else if (r.duplicate) {
    beep(500); setStatus('warn', r.message);
  } else {
    buzz(); setStatus('err', r.message);
  }
  } finally { scanInFlight = false; }
}
function renderShipList() {
  const list = document.getElementById('list');
  if (!shipScans.length) { list.innerHTML = '<div class="empty">No scans yet.</div>'; return; }
  list.innerHTML = shipScans.map(r => `
    <div class="item">
      <span class="imei">${r.imei}</span>
      ${r.warn ? '<span style="color:var(--warn);font-size:12px">unknown</span>' : ''}
    </div>
  `).join('');
}
async function undoLast() {
  if (!savesSettled('undo')) return;
  const r = await callApi('undoLastScan', [currentRequestId]);
  if (r.ok) {
    toast(r.message);
    currentCount = Math.max(0, currentCount - 1);
    refreshCounter();
    markLastSavedUndone();
  } else {
    toast(r.message);
  }
}
async function finalize() {
  if (!savesSettled('finalize')) return;
  if (errorCount() && !confirm(errorCount() + ' scan(s) were NOT saved (red). Finalize anyway?')) return;
  if (!confirm('Finalize ' + currentRequestId + '? This sets Qty Shipped + Date Shipped.')) return;
  const cab2pin = parseInt((document.getElementById('shipCab2pin') || {}).value, 10) || 0;
  const cab6pin = parseInt((document.getElementById('shipCab6pin') || {}).value, 10) || 0;
  const cab7pin = parseInt((document.getElementById('shipCab7pin') || {}).value, 10) || 0;
  const cableSentType = ((document.getElementById('shipCableSentType') || {}).value || '').trim();
  if ((cab2pin > 0 || cab6pin > 0 || cab7pin > 0) && !cableSentType) {
    if (!confirm('You entered cable quantities but no Cable Sent Type. Continue without a source?')) return;
  }
  const r = await callWithNotify('finalizeShipment', [currentRequestId, cab2pin, cab6pin, cab7pin, cableSentType]);
  if (r.ok) {
    toast(r.message, 3000);
    setTimeout(() => navigate('home'), 1200);
  } else {
    toast(r.message);
  }
}

// ---------- LOOKUP ----------
function renderLookup() {
  titleEl.textContent = 'Lookup IMEI';
  app.innerHTML = `<div id="scanArea"></div><div id="card"></div>`;
  renderScannerBlock('scanArea', onLookupScan);
}
async function onLookupScan(text) {
  const now = Date.now();
  if (text === lastScan && now - lastScanTime < 3000) return;
  if (scanInFlight) return;
  lastScan = text; lastScanTime = now;
  scanInFlight = true;
  try {
  beep(800);
  const r = await callApi('lookupImei', [text]);
  const card = document.getElementById('card');
  if (!r.ok) { card.innerHTML = '<div class="status err">'+r.message+'</div>'; return; }
  let html = '<div class="lookup-card"><h3>'+r.imei+'</h3>';
  if (r.device) {
    html += `
      <div class="kv"><span class="k">Batch</span><span>${r.device.batch || '—'}</span></div>
      <div class="kv"><span class="k">Type</span><span>${r.device.type || '—'}</span></div>
      <div class="kv"><span class="k">Status</span><span>${r.device.status || '—'}</span></div>
      <div class="kv"><span class="k">Supplier</span><span>${r.device.supplier || '—'}</span></div>
      <div class="kv"><span class="k">SIM</span><span>${r.device.sim || '—'}</span></div>
    `;
  } else {
    html += '<div style="color:var(--warn)">Not found in Devices.</div>';
  }
  if (r.history && r.history.length) {
    html += '<h3 style="margin-top:14px">Shipment history</h3>';
    r.history.forEach(h => {
      const t = h.scannedAt ? new Date(h.scannedAt).toLocaleDateString() : '';
      html += `<div class="kv"><span class="k">${t}</span><span>${h.requestId}</span></div>`;
    });
  }
  if (r.returns && r.returns.length) {
    html += '<h3 style="margin-top:14px">Returns</h3>';
    r.returns.forEach(rr => {
      const t = rr.dateReceived ? new Date(rr.dateReceived).toLocaleDateString() : '';
      html += `<div class="kv"><span class="k">${t}</span><span>${rr.status || ''}  •  ${rr.rmaResult || 'pending'}</span></div>`;
    });
  }
  html += '</div>';
  card.innerHTML = html;
  } finally { scanInFlight = false; }
}

// ---------- Status helper ----------
function setStatus(kind, msg) {
  const s = document.getElementById('status');
  if (!s) return;
  s.className = 'status ' + (kind === 'err' ? 'err' : kind === 'warn' ? 'warn' : 'ok');
  const cp = document.getElementById('countPill');
  if (cp) {
    s.innerHTML = msg + ' <span class="count-pill" id="countPill">'+cp.textContent+'</span>';
  } else {
    s.innerHTML = msg;
  }
}



// ---------- EDIT DEVICE ----------
let editDeviceRow = null;
let editDeviceImei = '';
let editDeviceStatusOptions = [];
let editDeviceCompanies = [];
let editDeviceRequestIds = [];
let editDeviceOriginalStatus = '';
let cableTypes = [];   // loaded once, used by ship + new-shipment screens

async function renderEditDevice() {
  titleEl.textContent = 'Edit Device';
  editDeviceRow = null;
  editDeviceImei = '';
  app.innerHTML = `
    <div class="field">
      <label>IMEI</label>
      <input id="edImei" placeholder="Scan or type IMEI" inputmode="numeric" autocomplete="off" />
    </div>
    <button class="primary" id="edLookupBtn">Look up</button>
    <div class="or-divider">— or scan with camera —</div>
    <div id="edScanArea"></div>
    <div id="edStatus" class="status ok" style="margin-top:10px">Loading dropdowns…</div>
    <div id="edForm" style="display:none; margin-top:14px"></div>
  `;
  document.getElementById('edLookupBtn').onclick = () => lookupEditImei(document.getElementById('edImei').value.trim());
  document.getElementById('edImei').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('edLookupBtn').click();
  });
  renderScannerBlock('edScanArea', text => {
    document.getElementById('edImei').value = text.replace(/\D/g, '').slice(0, 15);
    lookupEditImei(document.getElementById('edImei').value);
  });

  // Preload dropdown data (status options + company list)
  const [opts, companies] = await Promise.all([
    callApi('getDeviceStatuses', []),
    callApi('getCompanyOptions', []),
  ]);
  if (Array.isArray(opts)) editDeviceStatusOptions = opts;
  if (Array.isArray(companies)) editDeviceCompanies = companies;
  setEdStatus('ok', 'Enter or scan an IMEI to begin.');
}

async function lookupEditImei(imei) {
  if (!imei) { setEdStatus('warn', 'Type or scan an IMEI first.'); return; }
  setEdStatus('ok', 'Looking up…');
  const r = await callApi('lookupDevice', [imei]);
  if (!r.ok) { setEdStatus('err', r.message || 'Not found'); document.getElementById('edForm').style.display = 'none'; return; }
  editDeviceRow = r.rowIndex;
  editDeviceImei = r.imei;
  setEdStatus('ok', 'Loaded row ' + r.rowIndex);

  // Always include the device's current status, even if it isn't in the
  // dropdown list — otherwise the select shows "--" and saving blanks it.
  editDeviceOriginalStatus = String(r.status || '');
  const statusList = editDeviceStatusOptions.slice();
  if (editDeviceOriginalStatus && statusList.indexOf(editDeviceOriginalStatus) === -1) statusList.unshift(editDeviceOriginalStatus);
  const statusOpts = '<option value="">--</option>' + statusList.map(o =>
    '<option value="' + escapeAttr(o) + '"' + (o === editDeviceOriginalStatus ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');

  // Company options for the dropdown + datalist for typeahead
  const companyOpts = '<option value="">-- pick a company --</option>' +
    editDeviceCompanies.map(c => '<option value="' + c.code + '">' + escapeHtml(c.name) + ' (' + c.code + ')</option>').join('');

  document.getElementById('edForm').innerHTML = `
    <div class="field"><label>Batch #</label><input id="edBatch" value="${escapeAttr(r.batch || '')}" /></div>
    <div class="field"><label>IMEI</label><input value="${escapeAttr(r.imei || '')}" readonly style="opacity:0.7" /></div>
    <div class="field"><label>Type</label><input id="edType" value="${escapeAttr(r.type || '')}" /></div>
    <div class="field"><label>Status</label><select id="edStat">${statusOpts}</select></div>
    <div class="field"><label>Location</label>
      <select id="edLoc">
        <option value="" ${!r.location ? 'selected' : ''}>(none)</option>
        <option value="Toronto" ${r.location === 'Toronto' ? 'selected' : ''}>Toronto</option>
        <option value="Rob" ${r.location === 'Rob' ? 'selected' : ''}>Rob</option>
      </select>
    </div>

    <div class="or-divider">— Link or unlink IMEI from a shipment —</div>

    <div class="field">
      <label>Reason (leave blank to skip)</label>
      <select id="edReason">
        <option value="">(no shipment action)</option>
        <option value="New">New — add to shipment</option>
        <option value="Replacement">Replacement — add to shipment</option>
        <option value="Joyride employee">Joyride employee — add to shipment</option>
        <option value="Return">Return — unlink and add to Returns tab</option>
      </select>
    </div>
    <div class="field">
      <label>Company</label>
      <input list="edCompanyList" id="edCompany" placeholder="Type to filter, or pick…" />
      <datalist id="edCompanyList">
        ${editDeviceCompanies.map(c => '<option value="' + c.code + '">' + escapeHtml(c.name) + ' (' + c.code + ')</option>').join('')}
      </datalist>
    </div>
    <div class="field">
      <label>Request ID</label>
      <select id="edReq"><option value="">-- pick company first --</option></select>
    </div>

    <div class="field"><label>Add a note (optional)</label>
      <input id="edNote" placeholder="Free-text note logged with timestamp" />
    </div>
    <div class="field"><label>Existing notes</label>
      <div style="font-family:ui-monospace,Menlo,monospace; font-size:11px; background:#0f1418; padding:8px; border-radius:6px; max-height:160px; overflow:auto; white-space:pre-wrap">${escapeHtml(r.notes || '(none)')}</div>
    </div>
    <button class="primary" id="edSaveBtn">Save changes</button>
    <button class="secondary" id="edClearBtn" style="margin-top:8px">Clear &amp; look up another</button>
  `;
  document.getElementById('edSaveBtn').onclick = saveEditDevice;
  document.getElementById('edClearBtn').onclick = clearEditDeviceForm;
  document.getElementById('edCompany').addEventListener('change', loadRequestIdsForPicked);
  document.getElementById('edCompany').addEventListener('input', loadRequestIdsForPicked);
  document.getElementById('edForm').style.display = 'block';
}

async function loadRequestIdsForPicked() {
  const code = document.getElementById('edCompany').value.trim();
  const sel = document.getElementById('edReq');
  if (!code) { sel.innerHTML = '<option value="">-- pick company first --</option>'; return; }
  sel.innerHTML = '<option value="">Loading…</option>';
  const list = await callApi('getRequestIdsForCompany', [code]);
  if (!Array.isArray(list) || !list.length) {
    sel.innerHTML = '<option value="">-- no request IDs for ' + code + ' --</option>';
    return;
  }
  sel.innerHTML = '<option value="">-- pick a Request ID --</option>' +
    list.map(r => '<option value="' + r.requestId + '">' + r.requestId + ' • ' + (r.status || '?') + ' • qty ' + (r.qty || '?') + '</option>').join('');
  editDeviceRequestIds = list;
}

async function saveEditDevice() {
  if (!editDeviceRow) { setEdStatus('warn', 'Look up an IMEI first.'); return; }
  const updates = {
    batch: document.getElementById('edBatch').value,
    type: document.getElementById('edType').value,
    status: document.getElementById('edStat').value,
    location: document.getElementById('edLoc').value,
    notesAddon: document.getElementById('edNote').value,
  };
  const reason = document.getElementById('edReason').value;
  const companyCode = document.getElementById('edCompany').value.trim();
  const requestId = document.getElementById('edReq').value;

  setEdStatus('ok', 'Saving…');

  // First: apply Devices-side field changes
  const fieldRes = await callApi('updateDevice', [{ rowIndex: editDeviceRow, updates }]);
  if (!fieldRes.ok) { setEdStatus('err', 'Field update failed: ' + fieldRes.message); return; }

  // Then: if a Reason+Company+RequestID was provided, fire the shipment/return action
  if (reason && companyCode && requestId) {
    const actRes = await callApi('recordImeiAction', [{
      imei: editDeviceImei,
      rowIndex: editDeviceRow,
      reason,
      companyCode,
      requestId,
      // If you picked a Status yourself, the action won't override it.
      keepStatus: updates.status !== '' && updates.status !== editDeviceOriginalStatus,
    }]);
    if (actRes.ok) {
      beep(900);
      setEdStatus('ok', fieldRes.message + '. ' + actRes.message);
    } else {
      buzz();
      setEdStatus('err', actRes.message);
      return;
    }
  } else if (reason || companyCode || requestId) {
    setEdStatus('warn', fieldRes.message + '. Shipment action skipped — Reason + Company + Request ID all required.');
  } else {
    beep(900);
    setEdStatus('ok', fieldRes.message);
  }

  // Re-lookup so existing notes show the new entry
  lookupEditImei(editDeviceImei);
}

function clearEditDeviceForm() {
  editDeviceRow = null;
  editDeviceImei = '';
  document.getElementById('edImei').value = '';
  document.getElementById('edImei').focus();
  document.getElementById('edForm').style.display = 'none';
  setEdStatus('ok', 'Cleared. Scan or type the next IMEI.');
}

function setEdStatus(kind, msg) {
  const s = document.getElementById('edStatus');
  if (!s) return;
  s.className = 'status ' + (kind === 'err' ? 'err' : kind === 'warn' ? 'warn' : 'ok');
  s.textContent = msg;
}

function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- Boot ----------
navigate('home');
</script>
