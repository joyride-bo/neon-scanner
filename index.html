<style>
  :root {
    --bg: #0f1418;
    --panel: #1a232b;
    --accent: #2bb673;
    --warn: #e0a019;
    --error: #d04e3a;

    --border: #2a3640;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);

  }
  header {
    position: sticky; top: 0;
    background: var(--panel);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 17px; flex: 1; }
  .back {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 14px;

  main { padding: 16px; max-width: 600px; margin: 0 auto; }
  .home-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 12px; }
  .home-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 18px;
    font-size: 18px; font-weight: 600;
    color: var(--text);
    text-align: left;
    display: flex; align-items: center; gap: 14px;
  }
  .home-btn .icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent); display: grid; place-items: center;
    font-size: 22px;
  }
  .home-btn small {
    display: block; color: var(--muted); font-weight: 400; font-size: 13px;
    margin-top: 4px;
  }
  input, select, button, textarea { font: inherit; font-size: 16px; }
  .field {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .field label {
    display: block; color: var(--muted); font-size: 12px;

  .field input, .field select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;

  button.primary {
    background: var(--accent); color: white; border: none;
    border-radius: 10px; padding: 14px 18px; font-weight: 600; width: 100%;

  button.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 18px; font-weight: 500; width: 100%;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  .scanner-box {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    min-height: 60px;
  }
  .scanner-box video {
    width: 100%;
    display: block;
    background: #000;
  }
  .scanner-box .reticle {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 220px; height: 160px;
    border: 2px solid rgba(43, 182, 115, 0.9);
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.25);
    pointer-events: none;
  }
  .status {
    padding: 12px; border-radius: 10px; margin-top: 10px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 14px;
    word-break: break-word;
  }
  .status.ok    { border-color: var(--accent); }
  .status.warn  { border-color: var(--warn); }
  .status.err   { border-color: var(--error); }
  .scan-list {
    margin-top: 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .scan-list .item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;

  .scan-list .item:last-child { border-bottom: none; }
  .scan-list .item .imei { flex: 1; }
  .scan-list .empty { padding: 16px; color: var(--muted); text-align: center; font-size: 14px; }
  .count-pill {

  .lookup-card h3 { margin: 0 0 8px 0; font-size: 16px; }

  .lookup-card .kv .k { color: var(--muted); width: 100px; }
  .footer-actions { margin-top: 14px; display: grid; gap: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; font-size: 14px; z-index: 100;

  .manual-row button { flex: 0 0 auto; background: var(--accent); color: white; border: none; border-radius: 6px; padding: 0 16px; font-weight: 600; }
  .config-warning { background: var(--warn); color: #1a1a1a; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }

  .counter-banner {
    background: var(--accent); color: white;
    border-radius: 14px; padding: 18px 16px;
    text-align: center; margin-bottom: 12px;
    box-shadow: 0 4px 18px rgba(43, 182, 115, 0.25);
  }
  .counter-banner .count-num { font-size: 44px; font-weight: 700; line-height: 1; }
  .counter-banner .count-label { font-size: 14px; opacity: 0.9; margin-top: 4px; }
  .counter-banner.warn { background: var(--warn); color: #1a1a1a; box-shadow: 0 4px 18px rgba(224,160,25,0.3); }
  .counter-banner.done { background: #1f7a4d; }
  .role-badge {
    display: inline-block; background: var(--panel);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--muted); margin-left: 8px;

  .precount-big input {

  .or-strong {

    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
  }

  @media (max-width: 600px) { main { padding: 12px; } }
</style>

<header>
  <button class="back" id="backBtn" style="display:none">&lsaquo; Back</button>

<main id="app"></main>

<script>
// ===================================================
//  External Neon Scanner — calls Apps Script via POST.
//  Hosted on GitHub Pages / Netlify / Cloudflare Pages / etc.
//  Camera works because the page is NOT inside the
//  Apps Script iframe.
// ===================================================

// ---------- API helper ----------
async function callApi(action, args) {
  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      // text/plain avoids CORS preflight; Apps Script parses
      // postData.contents as the raw string regardless.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, action, args: args || [] }),
      redirect: 'follow',
      mode: 'cors',
    });
    if (!res.ok) return { ok: false, message: 'HTTP ' + res.status };
    return await res.json();
  } catch (e) {
    return { ok: false, message: 'Network: ' + (e.message || e) };
  }
}

// ---------- Audio + haptic feedback ----------
let audioCtx;
function beep(freq=900, dur=80) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = 0.18;
    o.start();
    setTimeout(() => { o.stop(); }, dur);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(40);
}
function buzz() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'square'; o.frequency.value = 220;
    g.gain.value = 0.18;
    o.start();
    setTimeout(() => { o.stop(); }, 220);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
}

function toast(msg, ms=1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// ---------- App state ----------
const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('backBtn');

let videoStream = null;
let scanIntervalId = null;
let detector = null;
let lastScan = '';
let lastScanTime = 0;
// In-flight guard — while true, all new scan callbacks are ignored.
// Prevents the 250ms detection loop from firing multiple concurrent
// server calls when the network round-trip is slow.
let scanInFlight = false;
let currentScanCallback = null;

// New state for v2: role + per-session expected/current counts
let currentRole = 'toronto';   // Only role used (Rob role retired)
let expectedCount = 0;      // user-entered target before a scan session
let currentCount = 0;       // running count for current scan session
let reconCompany = '';      // company name when using the type-in shortcut
let pendingFlow = '';       // 'receive' | 'ship' — what comes after precount

function stopScanner() {
  if (scanIntervalId) { clearInterval(scanIntervalId); scanIntervalId = null; }
  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
}

function navigate(view, ...args) {
  stopScanner();
  backBtn.style.display = (view === 'home') ? 'none' : 'inline-block';
  if (view === 'home')        renderHome();
  if (view === 'precount')    renderPrecount(args[0], args[1]);
  if (view === 'receive')     renderReceive();
  if (view === 'ship')        renderShipPicker();
  if (view === 'shipScan')    renderShipScan(args[0]);
  if (view === 'receiveReturn')     renderReceiveReturnPicker();
  if (view === 'receiveReturnScan') renderReceiveReturnScan(args[0]);
  if (view === 'lookup')      renderLookup();
  if (view === 'editDevice')  renderEditDevice();
  if (view === 'newShipment') renderNewShipment();
}
backBtn.onclick = () => navigate('home');

// ---------- ROLE PICKER ----------
// ---------- PRE-COUNT PROMPT ----------
// flow: 'receive' or 'ship'
// extra: for 'ship', the Request ID (or null if using company-name shortcut later)
function renderPrecount(flow, extra) {
  pendingFlow = flow;
  expectedCount = 0;
  currentCount = 0;
  titleEl.textContent = flow === 'receive' ? 'Receive — How many?' : 'Ship — How many?';
  const subtitle = flow === 'receive'
    ? 'Roughly how many units are you about to scan in?'
    : 'How many units are you about to scan for this shipment?';
  app.innerHTML = `
    <div class="field precount-big">
      <label>${subtitle}</label>
      <input id="expCount" type="number" min="1" inputmode="numeric" autofocus />
    </div>
    <button class="primary" id="precountGo">Start scanning</button>
    <button class="secondary" style="margin-top:10px" onclick="skipPrecount(${JSON.stringify(extra||'')})">Skip — I don't know yet</button>
  `;
  document.getElementById('expCount').focus();
  document.getElementById('precountGo').onclick = () => {
    const n = parseInt(document.getElementById('expCount').value, 10);
    if (!n || n < 1) { toast('Enter a number'); return; }
    expectedCount = n;
    proceedAfterPrecount(extra);
  };
  document.getElementById('expCount').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('precountGo').click();
  });
}
function skipPrecount(extra) {
  expectedCount = 0;
  proceedAfterPrecount(extra);
}
async function proceedAfterPrecount(extra) {
  if (pendingFlow === 'receive') {
    renderReceiveScan();
    return;
  }
  if (pendingFlow === 'receiveReturn') {
    navigate('receiveReturnScan', extra);
    return;
  }
  if (pendingFlow === 'ship') {
    if (extra && extra.startsWith && extra.startsWith('__RECON__:')) {
      // Company-name shortcut path — create a recon shipment first
      const company = extra.slice('__RECON__:'.length);
      const r = await callApi('createReconShipment', [company, expectedCount || null]);
      if (!r.ok) { toast(r.message || 'Failed'); navigate('ship'); return; }
      toast('Recon shipment ' + r.requestId);
      navigate('shipScan', r.requestId);
      return;
    }
    navigate('shipScan', extra);
  }
}

function counterBannerHTML() {
  const tgt = expectedCount;
  const cur = currentCount;
  let cls = '';
  let label;
  if (tgt > 0) {
    if (cur > tgt) cls = 'warn';
    else if (cur === tgt) cls = 'done';
    label = `${cur} of ${tgt} scanned`;
  } else {
    label = `${cur} scanned`;
  }
  return `<div class="counter-banner ${cls}" id="bigCounter">
    <div class="count-num" id="bigCounterNum">${cur}${tgt > 0 ? ' / ' + tgt : ''}</div>
    <div class="count-label" id="bigCounterLabel">${label}</div>
  </div>`;
}
function refreshCounter() {
  const banner = document.getElementById('bigCounter');
  if (!banner) return;
  const tgt = expectedCount;
  const cur = currentCount;
  let cls = 'counter-banner';
  let label;
  if (tgt > 0) {
    if (cur > tgt) cls += ' warn';
    else if (cur === tgt) cls += ' done';
    label = `${cur} of ${tgt} scanned`;
  } else {
    label = `${cur} scanned`;
  }
  banner.className = cls;
  document.getElementById('bigCounterNum').textContent = cur + (tgt > 0 ? ' / ' + tgt : '');
  document.getElementById('bigCounterLabel').textContent = label;
}

// ---------- HOME ----------
function renderHome() {
  let warning = '';
  if (WEB_APP_URL === 'PASTE_YOUR_EXEC_URL_HERE') {
    warning = '<div class="config-warning"><b>Setup not finished:</b> edit the WEB_APP_URL near the top of this HTML file before scanning.</div>';
  }
  titleEl.innerHTML = 'Neon Scanner <span class="role-badge">Toronto Office</span>';
  app.innerHTML = warning + `
    <div class="home-grid">
      <button class="home-btn" onclick="navigate('receive')">
        <span class="icon">&#x1F4E5;</span>
        <span>Receive
          <small>Scan new units in from manufacturer</small>
        </span>
      </button>
      <button class="home-btn" onclick="navigate('ship')">
        <span class="icon">&#x1F4E6;</span>
        <span>Ship
          <small>Link IMEIs to a Request ID as you pack</small>
        </span>
      </button>
      <button class="home-btn" onclick="navigate('receiveReturn')">
        <span class="icon" style="background:#9b4a4a">&#x21A9;</span>
        <span>Receive Return
          <small>Scan units coming back from a customer</small>
        </span>
      </button>
      <button class="home-btn" onclick="navigate('lookup')">
        <span class="icon">&#x1F50D;</span>
        <span>Lookup
          <small>Scan a unit to see its history</small>
        </span>
      </button>
      <button class="home-btn" onclick="navigate('editDevice')">
        <span class="icon" style="background:#3a6db5">&#x270E;</span>
        <span>Edit Device
          <small>Scan/type IMEI, change Status / Location / add Note</small>
        </span>
      </button>
    </div>
  `;
}

// ---------- Shared scanner UI ----------
function renderScannerBlock(parentId, onCodeFn) {
  currentScanCallback = onCodeFn;
  const hasBarcodeDetector = ('BarcodeDetector' in window);
  document.getElementById(parentId).innerHTML = `
    <div class="field" style="padding:8px">
      <div class="scanner-box" id="scannerBox">
        <video id="video" playsinline muted autoplay></video>
        <div class="reticle" id="reticle" style="display:none"></div>
      </div>
      <button class="primary" id="startCamBtn" style="margin-top:10px">
        ${hasBarcodeDetector ? 'Start camera' : 'Live camera not supported here'}
      </button>
      <div class="or-divider">— or —</div>
      <button class="secondary" id="photoBtn">Take photo with camera app</button>
      <input type="file" class="photo" id="photoInput" accept="image/*" capture="environment">
      <div class="or-divider">— or —</div>
      <div class="manual-row">
        <input id="manualImei" placeholder="Type/paste IMEI" inputmode="numeric" autocomplete="off">
        <button id="manualSubmit">Add</button>
      </div>
    </div>
    <div class="status ok" id="status">Tap <b>Start camera</b>, or take a photo, or type an IMEI.</div>
  `;
  document.getElementById('startCamBtn').disabled = !hasBarcodeDetector;
  document.getElementById('startCamBtn').onclick = () => startLiveCamera();
  document.getElementById('photoBtn').onclick = () => document.getElementById('photoInput').click();
  document.getElementById('photoInput').onchange = (e) => handlePhotoFile(e.target.files && e.target.files[0]);
  document.getElementById('manualSubmit').onclick = () => {
    const v = document.getElementById('manualImei').value.trim();
    if (v && currentScanCallback) {
      currentScanCallback(v);
      document.getElementById('manualImei').value = '';
    }
  };
  document.getElementById('manualImei').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('manualSubmit').click();
  });
  document.getElementById('video').style.display = 'none';
  document.getElementById('scannerBox').style.minHeight = '0';
}

async function startLiveCamera() {
  const btn = document.getElementById('startCamBtn');
  const status = document.getElementById('status');
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  if (status) { status.className = 'status ok'; status.textContent = 'Requesting camera…'; }

  if (!('BarcodeDetector' in window)) {
    showCamError('Browser missing BarcodeDetector. Use photo capture or type IMEI manually.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCamError('Browser does not expose camera access here.');
    return;
  }

  try {
    detector = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) {
    showCamError('BarcodeDetector init failed: ' + e);
    return;
  }

  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false,
    });
  } catch (e) {
    showCamError('Camera denied or unavailable: ' + (e && e.message ? e.message : e));
    return;
  }

  const video = document.getElementById('video');
  if (!video) return;
  video.srcObject = videoStream;
  video.style.display = 'block';
  document.getElementById('reticle').style.display = 'block';
  try { await video.play(); } catch (e) {}

  if (btn) btn.style.display = 'none';
  if (status) { status.className = 'status ok'; status.innerHTML = 'Camera live. Point at a QR code. <span class="count-pill" id="countPill">0 scanned</span>'; }

  scanIntervalId = setInterval(async () => {
    try {
      const codes = await detector.detect(video);
      if (codes && codes.length) {
        const text = codes[0].rawValue;
        if (text && currentScanCallback) currentScanCallback(text);
      }
    } catch (e) {}
  }, 250);
}

function showCamError(msg) {
  stopScanner();
  const btn = document.getElementById('startCamBtn');
  if (btn) { btn.disabled = false; btn.style.display = 'block'; btn.textContent = 'Try camera again'; }
  const status = document.getElementById('status');
  if (status) {
    status.className = 'status err';
    status.innerHTML = msg + '<br><span style="color:var(--muted);font-size:12px">Use the photo button or type an IMEI manually below.</span>';
  }
}

async function handlePhotoFile(file) {
  if (!file) return;
  const status = document.getElementById('status');
  if (status) { status.className = 'status ok'; status.textContent = 'Decoding photo…'; }
  try {
    const bitmap = await createImageBitmap(file);
    if (!('BarcodeDetector' in window)) {
      if (status) {
        status.className = 'status warn';
        status.innerHTML = 'This browser cannot decode QR images. Type the IMEI manually below.';
      }
      return;
    }
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const codes = await det.detect(bitmap);
    if (codes && codes.length && codes[0].rawValue && currentScanCallback) {
      currentScanCallback(codes[0].rawValue);
    } else {
      if (status) { status.className = 'status warn'; status.textContent = 'No QR code found in that photo.'; }
      buzz();
    }
  } catch (e) {
    if (status) { status.className = 'status err'; status.textContent = 'Photo decode failed: ' + e; }
  }
  const el = document.getElementById('photoInput');
  if (el) el.value = '';
}

// ---------- RECEIVE ----------
const recentReceives = [];

// Toronto entry point: ask batch # first, then precount.
// Rob entry: navigate('precount','receive') directly from home — no batch input.
function renderReceive() {
  titleEl.textContent = 'Receive Devices';
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const defaultBatch = String(d.getFullYear()).slice(2) + pad(d.getMonth()+1) + pad(d.getDate());
  app.innerHTML = `
    <div class="field">
      <label>Batch # (YYMMDD)</label>
      <input id="batch" value="${defaultBatch}" autocomplete="off" />
    </div>
    <button class="primary" id="receiveContinue">Continue</button>
  `;
  document.getElementById('receiveContinue').onclick = () => {
    const b = document.getElementById('batch').value.trim();
    if (!b) { toast('Batch # required'); return; }
    window._torontoBatch = b;
    navigate('precount', 'receive');
  };
}

// Actual scan UI for the receive flow (both roles land here after precount).
function renderReceiveScan() {
  titleEl.textContent = 'Receive Devices';
  app.innerHTML = `
    ${counterBannerHTML()}
    <div id="scanArea"></div>
    <div class="scan-list" id="list"><div class="empty">No scans yet.</div></div>
    <div class="footer-actions">
      <button class="secondary" onclick="navigate('home')">Done</button>

  if (r.device) {
    html += `
      <div class="kv"><span class="k">Batch</span><span>${r.device.batch || '—'}</span></div>
      <div class="kv"><span class="k">Type</span><span>${r.device.type || '—'}</span></div>

    `;
  } else {
    html += '<div style="color:var(--warn)">Not found in Devices.</div>';
  }
  if (r.history && r.history.length) {
    html += '<h3 style="margin-top:14px">Shipment history</h3>';
    r.history.forEach(h => {
      const t = h.scannedAt ? new Date(h.scannedAt).toLocaleDateString() : '';
      html += `<div class="kv"><span class="k">${t}</span><span>${h.requestId}</span></div>`;
    });
  }
  if (r.returns && r.returns.length) {
    html += '<h3 style="margin-top:14px">Returns</h3>';
    r.returns.forEach(rr => {
      const t = rr.dateReceived ? new Date(rr.dateReceived).toLocaleDateString() : '';
      html += `<div class="kv"><span class="k">${t}</span><span>${rr.status || ''}  •  ${rr.rmaResult || 'pending'}</span></div>`;

  } finally { scanInFlight = false; }
}

async function saveEditDevice() {
  if (!editDeviceRow) { setEdStatus('warn', 'Look up an IMEI first.'); return; }
  const updates = {
    batch: document.getElementById('edBatch').value,
    type: document.getElementById('edType').value,
    status: document.getElementById('edStat').value,
    location: document.getElementById('edLoc').value,
    notesAddon: document.getElementById('edNote').value,
  };
  const reason = document.getElementById('edReason').value;
  const companyCode = document.getElementById('edCompany').value.trim();
  const requestId = document.getElementById('edReq').value;

  setEdStatus('ok', 'Saving…');

  // First: apply Devices-side field changes
  const fieldRes = await callApi('updateDevice', [{ rowIndex: editDeviceRow, updates }]);
  if (!fieldRes.ok) { setEdStatus('err', 'Field update failed: ' + fieldRes.message); return; }

  // Then: if a Reason+Company+RequestID was provided, fire the shipment/return action
  if (reason && companyCode && requestId) {
    const actRes = await callApi('recordImeiAction', [{
      imei: editDeviceImei,
      rowIndex: editDeviceRow,
      reason,
      companyCode,
      requestId,
    }]);
    if (actRes.ok) {
      beep(900);
      setEdStatus('ok', fieldRes.message + '. ' + actRes.message);
    } else {
      buzz();
      setEdStatus('err', actRes.message);
      return;
    }
  } else if (reason || companyCode || requestId) {
    setEdStatus('warn', fieldRes.message + '. Shipment action skipped — Reason + Company + Request ID all required.');
  } else {
    beep(900);
    setEdStatus('ok', fieldRes.message);
  }

  // Re-lookup so existing notes show the new entry
  lookupEditImei(editDeviceImei);
}

function clearEditDeviceForm() {
  editDeviceRow = null;
  editDeviceImei = '';
  document.getElementById('edImei').value = '';
  document.getElementById('edImei').focus();
  document.getElementById('edForm').style.display = 'none';
  setEdStatus('ok', 'Cleared. Scan or type the next IMEI.');

  const s = document.getElementById('edStatus');
  if (!s) return;
  s.className = 'status ' + (kind === 'err' ? 'err' : kind === 'warn' ? 'warn' : 'ok');
  s.textContent = msg;
}

function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- Boot ----------
navigate('home');
</script>
</body>
